DDEP",Curie:"الكوري","Molar mass constant":"ثابت الكتلة المولية","Atomic mass unit":"وحدة الكتلة الذرية","AME2020 energy per atomic mass unit":"الطاقة لكل وحدة كتلة ذرية في AME2020","Tc-99m excitation energy":"طاقة إثارة Tc-99m","Exact SI defining constant.":"ثابت يُعرِّف وحدة SI وقيمته دقيقة بالتعريف.","Exact mathematical constant, represented approximately in binary64.":"ثابت رياضي دقيق يُمثَّل تقريبًا بصيغة binary64.","One minute is exactly 60 seconds.":"الدقيقة 60 ثانية بالضبط.","One hour is exactly 3,600 seconds.":"الساعة 3600 ثانية بالضبط.","24 hours of 60 minutes of 60 seconds.":"24 ساعة؛ كل ساعة 60 دقيقة وكل دقيقة 60 ثانية.","Application y = exactly 365.25 days; no calendar-year arithmetic.":"وحدة y في التطبيق تساوي 365.25 يومًا بالضبط؛ لا تُجرى حسابات تقويمية.","The tabulation convention is 31,556,926 seconds; this does not assert an exact astronomical tropical-year measurement.":"معيار الجدول 31556926 ثانية؛ لا يمثل قياسًا فلكيًا دقيقًا بالتعريف للسنة الاستوائية.","1 Ci = exactly 3.7 × 10¹⁰ Bq.":"الكوري الواحد يساوي 3.7 × 10¹⁰ بيكريل بالضبط.","CODATA2022; measured after the 2019 SI redefinition.":"قيمة مقاسة من CODATA2022 بعد إعادة تعريف SI في 2019.","CODATA2022 atomic mass constant.":"ثابت الكتلة الذرية من CODATA2022.","Conversion constant pinned to AME2020 Table B.":"ثابت تحويل من الإصدار المحدد AME2020، الجدول B.","NUBASE2020 row 099 0431.":"السطر 099 0431 في NUBASE2020.","Version 2.1.0 · Reference snapshot 14 October 2026 · Contributions should include reproducible examples, tests and citations for any changed reference value.":"الإصدار 2.1.0 · مراجعة المراجع في 14 أكتوبر 2026 · يجب أن تتضمن المساهمات أمثلة قابلة لإعادة الحساب واختبارات ومصادر لأي قيمة مرجعية معدلة.","Numerical input retained":"القيمة العددية المحفوظة","y · Julian year":"y · سنة يوليانية","Equivalent half-life:":"نصف العمر المكافئ:","This is a single-nuclide model. It excludes radioactive daughters, external production, biological clearance, dose and decay-chain equilibrium. No combined uncertainty is inferred; numerical details distinguish central values from reference precision.":"نموذج لنظير أب منفرد؛ لا يشمل البنات المشعة أو الإنتاج الخارجي أو الإطراح الحيوي أو الجرعة أو اتزان السلاسل. لا يُستنتج عدم يقين كلي؛ تميّز التفاصيل العددية القيم المركزية عن دقة المرجع.","Numerical details (unit conversion)":"تفاصيل التحويل العددية","Numerical details (central values)":"التفاصيل العددية للقيم المركزية","Extra digits are for reproducibility, not measurement precision.":"الخانات الإضافية لإعادة إنتاج الحساب، وليست دقة قياس إضافية.","Half-life contribution only":"مساهمة نصف العمر وحدها","First-order reference half-life sensitivity; other inputs are held fixed. This is not a combined uncertainty or a confidence interval.":"حساسية نصف العمر المرجعي بتقريب من الرتبة الأولى مع تثبيت بقية المدخلات. ليست عدم يقين مركبًا أو فاصل ثقة.","See the numerical substitutions in Calculation Steps. No input uncertainty is assumed.":"راجع التعويض العددي في خطوات الحل؛ لم يُفترض عدم يقين لمدخلات المستخدم.","Converted digits are numerical precision, not additional measurement precision. Reference-aware rounding uses only the half-life contribution with other inputs held fixed; it is not a combined uncertainty budget.":"خانات التحويل دقة عددية وليست دقة قياس إضافية. يعتمد تقريب العرض على مساهمة نصف العمر وحدها مع تثبيت بقية المدخلات؛ لا يمثل ميزانية عدم يقين كلية.","Reference central values; display rounding does not add measurement precision. Focus a shortened field to inspect its stored numerical value.":"تُستخدم القيم المرجعية المركزية؛ تقريب العرض لا يضيف دقة قياس. انقر داخل الحقل المختصر لعرض قيمته العددية المحفوظة أو تحريرها.","Carbon-14 uses the DDEP 2012 evaluation, 5700 ± 30 a. The historical 5730 ± 40 yr recommendation is a different evaluation, not a unit conversion.":"يستخدم كربون-14 تقييم DDEP لعام 2012: 5700 ± 30 a. توصية 5730 ± 40 yr التاريخية تقييم مختلف، وليست تحويل وحدة.","y is exactly 365.25 days (Julian); source a is 31,556,926 seconds. Extra digits are retained for reproducibility only.":"وحدة y سنة يوليانية تساوي 365.25 يومًا بالضبط؛ ووحدة a المرجعية تساوي 31556926 ثانية. الخانات الإضافية محفوظة لإعادة إنتاج الحساب فقط.","Future decay only: t ≥ 0. Rounded fields retain their numerical value; focus to inspect or edit.":"تحلل مستقبلي فقط؛ الزمن غير سالب. يحتفظ الحقل المقرب بقيمته العددية؛ انقر داخله للفحص أو التحرير.","Curve coordinates and hover values retain numerical central-value precision; they do not add experimental accuracy. Inspection uses the same display policy as the result table.":"إحداثيات المنحنى وقيم مرور المؤشر تحافظ على الدقة العددية للقيم المركزية دون إضافة دقة تجريبية. يستخدم فحص النقطة سياسة العرض نفسها للجدول.","No combined output uncertainty is inferred. Reference-aware display rounding uses only first-order half-life sensitivity with user inputs held fixed; it does not include their unknown uncertainties or combine molar-mass uncertainty.":"لا يُستنتج عدم يقين كلي للنتائج. يعتمد تقريب العرض على حساسية نصف العمر من الرتبة الأولى مع تثبيت مدخلات المستخدم؛ لا يشمل أخطاءها غير المعروفة ولا يجمع عدم يقين الكتلة المولية.","Numerical details, substitutions and CSV retain central-value precision for reproducibility, not extra measurement precision.":"تفاصيل الحساب والتعويض وCSV تحفظ دقة القيم المركزية لإعادة الحساب، لا دقة قياس إضافية.","A fraction is subnormal and has limited relative precision. Activity and percentages are evaluated separately in log space.":"النسبة في المجال دون الطبيعي ودقتها النسبية محدودة؛ يُحسب النشاط والنسب المئوية بصورة مستقلة باللوغاريتمات.","An activity is subnormal; its relative precision is limited by the binary64 spacing.":"النشاط في المجال دون الطبيعي؛ دقته النسبية محدودة بتباعد القيم في binary64.","Central constants":"الثوابت المركزية","Constant definitions and source editions are shared by every calculator.":"تستخدم جميع الحاسبات تعريفات الثوابت وإصدارات المصادر نفسها.",Quantity:"الكمية","Calculated value":"القيمة المحسوبة",Unit:"الوحدة","Reference uncertainty":"عدم اليقين المرجعي",Source:"المصدر","Exact definition":"تعريف دقيق","Chart range exceeds numerical range.":"مجال الرسم يتجاوز المجال العددي.","Remaining percentage is below floating-point range; displayed 0% is not exact physical zero.":"النسبة المتبقية أقل من المجال العددي؛ عرض 0% لا يعني الصفر الفيزيائي تمامًا.","Mass is evaluated in log space even when the intermediate nucleus count is outside numerical range.":"تُحسب الكتلة باللوغاريتمات حتى عندما يتجاوز العدد الوسيط للأنوية المجال العددي.","Avogadro constant: 6.02214076 × 10²³ mol⁻¹, exact. Activity is in Bq and λ is in s⁻¹.":"ثابت أفوجادرو دقيق: 6.02214076 × 10²³ mol⁻¹. النشاط بوحدة Bq وثابت التحلل بوحدة s⁻¹.","Reference half-life uncertainty (k = 1)":"عدم يقين نصف العمر المرجعي (k = 1)","Atomic mass uncertainty (k = 1)":"عدم يقين الكتلة الذرية (k = 1)","AME2020 energy conversion":"تحويل الطاقة من AME2020","DDEP evaluation":"تقييم DDEP","Sampling mode":"طريقة أخذ النقاط","Time points":"النقاط الزمنية","Activity underflow":"النشاط أقل من المجال العددي",Initial:"الابتدائي","Remaining %":"النسبة المتبقية","reference yr":"سنة مرجعية","At 100%, no time has elapsed. At 0%, an exponential decay has no finite solution. A zero-activity sample has no unique activity-target solution.":"عند 100% يكون الزمن صفرًا. وعند 0% لا يوجد زمن محدود في النموذج الأسي. والعينة ذات النشاط الصفري لا تحدد زمن وصول وحيدًا.","Result mass unit":"وحدة الكتلة الناتجة","Analysis complete. Remaining activity":"اكتمل التحليل. النشاط المتبقي","half-lives":"أنصاف أعمار","of the initial parent activity remains. The nuclei and mass results refer to this same elapsed time.":"من النشاط الابتدائي للنظير الأب يبقى. نتائج الأنوية والكتلة تخص الزمن نفسه.","A closed sample with a constant decay rate. All calculations use SI internally; display units are converted explicitly.":"عينة مغلقة بمعدل تحلل ثابت. تُستخدم وحدات SI في الحسابات وتُحوّل وحدات العرض بصورة صريحة.","This is a single-nuclide model. It excludes radioactive daughters, external production, biological clearance, dose and decay-chain equilibrium. Reference uncertainties are shown but not propagated.":"نموذج لنظير منفرد؛ لا يشمل البنات المشعة أو الإنتاج الخارجي أو الإطراح الحيوي أو الجرعة أو اتزان السلاسل. يُعرض عدم اليقين المرجعي دون ترحيله إلى النتائج.","A value in d⁻¹ is a rate per day. Converting to s⁻¹ divides the numerical value by 86,400.":"القيمة بوحدة d⁻¹ معدل لكل يوم. للتحويل إلى s⁻¹ تُقسم القيمة العددية على 86400.","Both outputs describe the same exponential decay. ln(2) = 0.6931471805599453.":"النتيجتان تصفان التحلل الأسي نفسه. ln(2) = 0.6931471805599453.","Eight traceable reference nuclides. Search by name, symbol or atomic number and inspect provenance.":"ثمانية نظائر ببيانات مرجعية موثقة. ابحث بالاسم أو الرمز أو العدد الذري واطّلع على المصادر.","Choose Custom half-life in any calculator, then supply a name, half-life and optional molar mass. User-supplied values are never attributed to the reference database.":"اختر نصف عمر مخصصًا في الحاسبة وأدخل اسم النظير ونصف عمره وكتلته المولية عند الحاجة. بيانات المستخدم لا تُنسب إلى قاعدة المراجع.","Isotope mass percentage must be greater than 0 and at most 100.":"يجب أن تكون النسبة الكتلية للنظير أكبر من 0 وألا تتجاوز 100.","Sample mass exceeds numerical range.":"كتلة العينة تتجاوز المجال العددي.","The continuum model accepts an expected count; individual samples have integer counts.":"يقبل النموذج المستمر عددًا متوقعًا؛ أما العينة المفردة فلها عدد صحيح من الأنوية.","Nₐ = 6.02214076 × 10²³ mol⁻¹ (exact). M is the neutral-atom molar mass in g mol⁻¹.":"ثابت أفوجادرو دقيق: Nₐ = 6.02214076 × 10²³ mol⁻¹. وM الكتلة المولية للذرة المتعادلة بوحدة g mol⁻¹.","Steps show the first 12 points; the table and export contain every calculated point.":"تعرض الخطوات أول 12 نقطة؛ يتضمن الجدول والتصدير جميع النقاط المحسوبة.","Enter a valid sample and time values to generate results.":"أدخل بيانات عينة وأزمنة صحيحة لإظهار النتائج.","Inspect time cannot be negative.":"زمن الفحص لا يمكن أن يكون سالبًا.","Chart has not rendered yet.":"لم يظهر الرسم بعد.","Select at least one visible curve.":"اختر منحنى مرئيًا واحدًا على الأقل.","Below numerical range, not physical zero":"أقل من المجال العددي، وليس صفرًا فيزيائيًا","Derived isomer atomic mass: AME2020 Tc-99 ground-state mass 98.906249681 u + NUBASE2020 excitation 142.6836(11) keV / (931494.10242 keV/u). Molar mass includes the CODATA2022 molar mass constant. Uncertainty is dominated by the ground-state mass.":"كتلة الحالة شبه المستقرة مشتقة من كتلة Tc-99 الأرضية في AME2020: 98.906249681 u، مضافًا إليها طاقة الإثارة في NUBASE2020: 142.6836(11) keV، مقسومة على 931494.10242 keV/u. تشمل الكتلة المولية ثابت CODATA2022؛ يهيمن عدم يقين الكتلة الأرضية على عدم اليقين.","Unknown time unit.":"الوحدة الزمنية غير معروفة.","Unknown activity unit.":"وحدة النشاط غير معروفة.","Unknown mass unit.":"وحدة الكتلة غير معروفة.","Unknown unit.":"الوحدة غير معروفة.","Analysis is too large for a share link. Use a CSV export.":"التحليل كبير جدًا لرابط مشاركة؛ استخدم تصدير CSV.","Decay constant exceeds the floating-point range for this half-life.":"ثابت التحلل خارج المجال العددي لنصف العمر المحدد.","Half-life exceeds the floating-point range for this decay constant.":"نصف العمر خارج المجال العددي لثابت التحلل المحدد.","Isotope mass fraction must not exceed 100%. It is a mass fraction, not an atom fraction.":"النسبة الكتلية للنظير لا تتجاوز 100%؛ هي نسبة كتلية وليست ذرية.","Isotope mass fraction":"النسبة الكتلية للنظير","Target time":"الزمن المستهدف","Comparison time":"زمن المقارنة","Time-unit factor":"معامل الوحدة الزمنية","Converted time":"الزمن المحوّل","The vertical coordinate is log₁₀ of the selected quantity. Nonpositive values are omitted; logarithmic values can remain visible below ordinary floating-point range.":"المحور الرأسي لوغاريتم عشري للمتغير المحدد؛ تُستبعد القيم غير الموجبة. يمكن إظهار القيم اللوغاريتمية أقل من المجال العددي المعتاد.","Numerical substitution":"التعويض العددي","Evaluate each time":"الحساب عند كل زمن","No finite result":"لا توجد نتيجة م لنشاط","Results update as you change your sample.":"تتحدّث النتائج عند تعديل المدخلات.","Time to target activity":"الزمن للوصول إلى نشاط مستهدف","Use the same sample defined on the left.":"تستخدم العينة المعرّفة في قسم المدخلات.","Target percentage":"النسبة المستهدفة","Target remaining percentage":"النسبة المتبقية المستهدفة","0–100% of the initial activity.":"من 0 إلى 100% من النشاط الابتدائي.","The target must not exceed the initial activity.":"يجب ألا يتجاوز النشاط المستهدف النشاط الابتدائي.","An exponential decay approaches zero asymptotically. It never reaches exact zero in finite time.":"التحلل الأسي يقترب من الصفر دون بلوغه تمامًا في زمن محدود.","Target activity must not exceed initial activity in a future-decay model.":"لا يمكن أن يتجاوز النشاط المستهدف النشاط الابتدائي في التحلل المستقبلي.","A zero-activity sample has no unique target-time solution. Enter a positive initial activity.":"العينة ذات النشاط الصفري لا تحدد زمن وصول وحيدًا. أدخل نشاطًا ابتدائيًا موجبًا.","Target percentage must be between 0 and 100.":"يجب أن تكون النسبة المستهدفة بين 0 و100.",Conversion:"التحويل","Activity → Mass":"من النشاط إلى الكتلة","Mass → Activity":"من الكتلة إلى النشاط","Activity → Nuclei":"من النشاط إلى الأنوية","Nuclei → Activity":"من الأنوية إلى النشاط","Nuclei → Mass":"من الأنوية إلى الكتلة","Define the calculation":"عرّف العملية","Calculated quantities":"الكميات المحسوبة","Activity unit":"وحدة النشاط","Mass unit":"وحدة الكتلة","Isotope mass percentage":"النسبة الكتلية للنظير","100% means pure isotope. This is a mass fraction, not an atom fraction or natural abundance.":"100% تعني نظيرًا نقيًا؛ هذه نسبة كتلية وليست نسبة ذرية أو وفرة طبيعية.","Fewer than one nucleus is an expected ensemble value, not a literal fractional nucleus.":"عدد أقل من نواة واحدة هو قيمة متوقعة لمجموعة عينات، وليس جزءًا حرفيًا من نواة.","At a specified mass fraction f, m_isotope = f × m_sample. Activity belongs only to the selected isotope. The mixture composition and carriers are not inferred.":"عند نسبة كتلية معلومة f تكون كتلة النظير مساوية لكتلة العينة مضروبة في f. النشاط للنظير المحدد فقط؛ لا يُستنتج تركيب الخليط أو المواد الحاملة.","Sample & time points":"العينة والنقاط الزمنية","Time-point unit":"وحدة النقاط الزمنية","Generate half-life points":"توليد نقاط أنصاف الأعمار","Your time-series results":"نتائج السلسلة الزمنية","Activity at multiple times":"النشاط عند أزمنة متعددة","Export CSV":"تصدير CSV","Separate values with commas, spaces or line breaks. Up to 1,000 points; all must be nonnegative.":"افصل القيم بفواصل أو مسافات أو أسطر. حتى 1000 نقطة غير سالبة.","Start time":"زمن البداية","End time":"زمن النهاية","Point count":"عدد النقاط","Generate interval":"توليد الفترة","Custom times":"أزمنة مخصصة",Interval:"فترة زمنية","Displayed variable":"المتغير المعروض","Activity over time":"النشاط مع الزمن","Time-series curve":"منحنى السلسلة الزمنية","Activity table":"جدول النشاط","Select isotopes":"اختر النظائر","Choose two or more reference nuclides.":"اختر نظيرين موثقين أو أكثر.","Use the same initial activity":"استخدام نشاط ابتدائي موحد","Common initial activity":"النشاط الابتدائي المشترك","Compare after":"المقارنة بعد","Activity unit for all inputs":"وحدة النشاط لجميع المدخلات","Select at least two isotopes to compare.":"اختر نظيرين على الأقل للمقارنة.","Sources for the selected isotopes":"مصادر النظائر المختارة","Published values, their uncertainties and the scope of each parent-only model.":"القيم المنشورة وعدم يقينها وحدود نموذج النظير الأب.","Equal initial activities isolate the effect of half-life.":"النشاط الابتدائي الموحد يتيح مقارنة تأثير نصف العمر.","Different initial activities are compared as entered.":"تُقارن الأنشطة الابتدائية المختلفة كما أُدخلت.","Every curve represents an independent parent nuclide. These curves do not form a decay chain.":"كل منحنى يمثل نظيرًا أبًا مستقلًا؛ هذه المنحنيات لا تمثل سلسلة تحلل.",Linear:"خطي",Log:"لوغاريتمي","Chart scale":"مقياس الرسم","Download chart as PNG":"تنزيل الرسم بصيغة PNG","Chart range":"نهاية مجال الرسم","Visible range":"المجال المرئي","Range start":"بداية المجال","Range end":"نهاية المجال","Zoom in":"تكبير","Zoom out":"تصغير","Reset zoom":"إعادة مجال الرسم","Inspect time":"فحص نقطة زمنية",Inspect:"فحص","Show half-life markers":"علامات نصف العمر","Show initial activity":"إظهار النشاط الابتدائي","Visible curves":"المنحنيات المرئية","Parent activity":"نشاط النظير الأب","Independent parent activities":"أنشطة نظائر أب مستقلة","Half-life markers":"علامات أنصاف الأعمار","Hover or tap to inspect":"مرّر المؤشر أو انقر للفحص","logarithmic scale":"مقياس لوغاريتمي","The vertical coordinate is log₁₀(activity). Exact-zero initial activity is omitted. Log values can remain visible below ordinary floating-point activity range.":"المحور الرأسي لوغاريتم عشري للنشاط؛ يُستبعد النشاط الابتدائي الصفري. يمكن إظهار قيم أقل من مجال النشاط العددي المعتاد.","Time points cannot be distinguished at double precision. Widen the interval or reduce the point count.":"لا يمكن تمييز النقاط بهذه الدقة العددية؛ وسّع الفترة أو قلّل عدد النقاط.","End time must be greater than start time.":"يجب أن تتجاوز نهاية الفترة بدايتها.","Point count must be an integer between 2 and 1,000.":"يجب أن يكون عدد النقاط عددًا صحيحًا بين 2 و1000.","Evaluated reference data":"بيانات مرجعية مقيّمة","Half-life:":"نصف العمر:","Neutral-atom mass:":"كتلة الذرة المتعادلة:","Molar mass:":"الكتلة المولية:","(reference tropical years)":"(سنوات استوائية مرجعية)","DDEP half-life":"نصف العمر من DDEP","AME2020 mass":"الكتلة من AME2020","CODATA constants":"ثوابت CODATA","NUBASE excitation":"طاقة الإثارة من NUBASE","Carbon-14":"كربون-14","Iodine-131":"يود-131","Technetium-99m":"تكنيشيوم-99m","Cobalt-60":"كوبالت-60","Cesium-137":"سيزيوم-137","Fluorine-18":"فلور-18","Uranium-238":"يورانيوم-238","Radium-226":"راديوم-226","Uncertainties are reference metadata (k = 1); they are not propagated. A UI year is 365.25 days. Source years are converted to seconds before calculation.":"عدم اليقين المرجعي (k = 1) معروض للتوثيق ولا يُرحّل إلى النت
